services:
  postgres:
    image: postgres:16-alpine
    container_name: ggi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-ggi}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ggi_password}
      POSTGRES_DB: ${DB_NAME:-ggi_assessment}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-ggi} -d ${DB_NAME:-ggi_assessment}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
